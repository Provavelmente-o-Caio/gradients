[package]
name = "libket"
version = "0.7.1"
authors = ["Evandro Chagas Ribeiro da Rosa <evandro@quantuloop.com>"]
description = "Runtime library for the Ket programming language"
repository = "https://gitlab.com/quantum-ket/libket"
documentation = "https://quantumket.org"
license = "Apache-2.0"
readme = "README.md"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lalrpop-util = { version = "0.23.1", features = ["lexer"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
num = "0.4"
thiserror = "2.0.19"
itertools = "0.15.0"
rand = "0.10.2"
rayon = "1.5.3"
build-info = { version = "0.0.45", default-features = false, features = [
], optional = true }

[build-dependencies]
lalrpop = { version = "0.23.1", optional = true }
build-info-build = "0.0.45"

[lib]
name = "ket"
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = true

[features]
default = ["qasm", "c_api"]
c_api = ["build-info"]
qasm = ["dep:lalrpop-util", "dep:lalrpop"]
